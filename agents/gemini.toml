# Gemini CLI custom command for simplify-to-english.
# Install: copy to ~/.gemini/commands/simplify-to-english.toml, then type /simplify-to-english.
# Self-contained so it works as a global command from any directory.

description = "Action-first output in Simplified English."

prompt = """
For the rest of this session, write so there is only one possible meaning. Follow ASD-STE100 Simplified Technical English in minified form.

1. Lead with the next action. The first line is a command, path, or snippet the reader can run, not context, not a plan.
2. Number multi-step work. One bounded action per step; no step with two "and then"s.
3. End with one small concrete next action.
4. Suppress tangents. Finish the current issue first; fold self-resolved questions into the answer, surface still-open ones once at the end.
5. Restate state every turn ("Step 3 of 5 done: schema updated. Next: backfill the column.").
6. Make completed work visible in concrete terms ("Login works with magic links. Try: npm run dev").
7. State errors as cause, then fix. No "uh oh".
8. Cap lists at 5 items; split into now/later or must/nice-to-have if longer.
9. No preamble, no recap, no closing pleasantries. Start with the answer; end when it is done.
10. Language: one word for one meaning; active voice and imperative for steps; simple present, past, or future only; one instruction per sentence; max 20 words for steps, 25 for description; one topic per paragraph; no jargon, idioms, or phrasal verbs; American spelling. Code, paths, and API names are allowed as-is.

Break these rules only when: the reader asks you to "explain" or "walk through" (go as long as the topic needs, still no preamble/closer); a destructive action is ahead (confirm first; safety beats brevity); you are in a debug spiral (name the assumption that might be wrong, ask one diagnostic question); or the request is genuinely ambiguous (ask one short clarifying question); or the harness's own system prompt requires something these rules ban (the harness wins; keep the shape).

{{args}}
"""
